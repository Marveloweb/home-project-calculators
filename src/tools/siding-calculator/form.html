<div class="group">
  <!-- diagram: siding -->
  <div class="row">
    <label class="field"><span>Distance around the house</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="perimeter" value="140"><span class="unit">ft</span></span><span class="hint">Add up every wall you will side</span></label>
    <div class="field ftin"><span>Wall height</span>
      <div class="ftin-pair">
        <label><input type="number" inputmode="decimal" min="0" step="any" name="wallHeight_ft" value="9"><span class="unit">ft</span></label>
        <label><input type="number" inputmode="decimal" min="0" step="any" name="wallHeight_in" value=""><span class="unit">in</span></label>
      </div>
      <span class="hint">Foundation to the eaves</span>
    </div>
  </div>
  <div class="row">
    <label class="field"><span>Gables</span><input type="number" inputmode="numeric" min="0" step="1" name="gables" value="2"><span class="hint">Triangles under the roof ends</span></label>
    <label class="field"><span>Gable width</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="gableWidth" value="30"><span class="unit">ft</span></span><span class="hint">At the base</span></label>
    <label class="field"><span>Gable height</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="gableHeight" value="6"><span class="unit">ft</span></span><span class="hint">Base to the peak</span></label>
  </div>
</div>

<div class="group">
  <p class="group-title">Openings and corners</p>
  <div class="row">
    <label class="field"><span>Windows</span><input type="number" inputmode="numeric" min="0" step="1" name="windows" value="12"><span class="hint">For trim around them</span></label>
    <label class="field"><span>Doors</span><input type="number" inputmode="numeric" min="0" step="1" name="doors" value="2"><span class="hint">Entry doors</span></label>
    <label class="field"><span>Garage and sliding doors</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="largeOpenSqFt" value="0"><span class="unit">sq ft</span></span><span class="hint">A 16 x 7 ft door is 112</span></label>
  </div>
  <div class="row">
    <label class="field"><span>Outside corners</span><input type="number" inputmode="numeric" min="0" step="1" name="outsideCorners" value="4"></label>
    <label class="field"><span>Inside corners</span><input type="number" inputmode="numeric" min="0" step="1" name="insideCorners" value="0"></label>
  </div>
</div>

<div class="group">
  <p class="group-title">Siding</p>
  <fieldset class="choices">
    <legend>Material</legend>
    <label><input type="radio" name="material" value="vinyl" checked><span>Vinyl</span></label>
    <label><input type="radio" name="material" value="fiber"><span>Fiber cement lap</span></label>
  </fieldset>
  <div class="row">
    <label class="field" data-mat="fiber" hidden><span>Plank and exposure</span>
      <select name="exposure">
        <option value="4">5 1/4 in plank, 4 in exposure</option>
        <option value="5">6 1/4 in plank, 5 in exposure</option>
        <option value="6">7 1/4 in plank, 6 in exposure</option>
        <option value="7" selected>8 1/4 in plank, 7 in exposure</option>
        <option value="8">9 1/4 in plank, 8 in exposure</option>
        <option value="10.75">12 in plank, 10 3/4 in exposure</option>
      </select>
      <span class="hint">12 ft planks</span>
    </label>
    <label class="field"><span>Extra for cuts and waste</span><span class="with-unit"><input type="number" inputmode="decimal" min="0" step="any" name="wastePct" value="10"><span class="unit">%</span></span><span class="hint">10% is standard</span></label>
  </div>
  <label class="check"><input type="checkbox" name="wrap" checked> <span>Add house wrap</span></label>
</div>
